<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

      <img src="{{illustrationSrc}}" alt="" />

      <p class="body-text">{{bodyHtml}}</p>
    </div>
  </div>

</html>
